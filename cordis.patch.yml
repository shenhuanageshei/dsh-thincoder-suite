# dsh-thincoder-suite bundle：向组合挂 thincoder 四功能（advisor 评审收敛 / eng 工程模式 / escalate 飞刀 / consult 会诊）
#
# 示例配置（部署时按自身环境替换 provider/model——本文件在 bundle 安装时会作为默认 patch 应用，
# 留空的键运行时全部可选，示例仅展示形状）。分组结构见 docs/2026-09-01-advisor-config-design.md §3.1。
#
# 二层配置（二期，docs/2026-09-02-settings-ui-design.md §2）：
# - 本文件 config = entry base（启动快照）：改动需重启 DSH 生效；
# - $DSH_HOME/.thincoder/config.json 的 config = user 层（DSH 设置面板「Thincoder」页编辑；
#   字段级覆盖下方 base；保存即生效无需重启；删除/清空则回落本 base）。
#   用户层可配字段白名单：advisor.round1/convergence 组（provider/model/effort/timeoutMs/runner）、
#   advisor.includeProjectGuide、advisor.maxOutputTokens、advisor.contextTokens（批 5）、
#   advisor.standardsDoc、advisor.documentMapDoc（批 7）、advisor.criteriaDoc（批 13）、
#   consultModels（整体替换）、engCoderMaxTokens、engCoderEffort、codexCli、dshBackgroundTimeoutMs、
#   consultTimeoutMs、engTokenTtlMs（末两键 D-29 并入）、ledger（批 36 个人任务台账：开关与话术模板）。
#   base 专属（user 层不接受）：engineering 等。
#   下列示例值若在 user 层被覆盖，以 user 层为准。
- insert:
    - id: thincoder-suite
      name: '@dsh-external/dsh-thincoder-suite'
      config:
        # escalate/consult 共用模型池（最多 5 个）。首个为飞刀默认。
        # 示例占位——替换为你部署里实际可用的 provider/model 组合。
        consultModels:
          - provider: your-provider
            model: your-model
          - provider: another-provider
            model: another-model
        # advisor 评审路由（不配置则跟随当前会话模型）——按轮次分层（§3.2）：
        advisor:
          round1:                    # 首次全量评审（advisorRound == 0）
            provider: your-provider
            model: your-model
            effort: medium           # 可选 off|low|medium|high|max；缺省不传（适配器默认）
            timeoutMs: 900000        # 缺省 600000
          convergence:               # 收敛轮（advisorRound >= 1，round 2+ 共用）
            provider: your-provider
            model: your-fast-model
            effort: low
            timeoutMs: 300000
          includeProjectGuide: false # 评审是否注入 AGENTS.md（默认 false，§3.5）
        # F9 子代理资源（§3.10）：
        engCoderMaxTokens: 65536     # eng_coder 子代理输出预算（可选；缺省 65536）
        engCoderEffort: medium       # eng_coder 子代理推理档（可选 off|low|medium|high|max；缺省 medium；非法值忽略并警告 N4）
        # 所有会话默认进工程模式（默认 false）
        engineering: false
        engTokenTtlMs: 604800000     # design token 有效期（D-30：缺省值改为 7d，本 base 同步；值域 600000..2592000000 = 10min..30d；现已可从设置页覆盖）
        consultTimeoutMs: 1800000    # 会诊各模型看门狗（D-29：现已可从设置页覆盖；值域 30000..3600000；原 600000 会让慢模型把整轮吊满 10min）
        # 个人任务台账（批 36；键语义见 README「配置（两层）」与 docs/2026-10-16-task-ledger-design.md §十四）
        ledger:
          mode: standalone             # off | standalone（缺省 standalone；off 只关个人台账分区，防漂移状态区仍在）
          docPaths: []                 # 结构化验收档路径清单（相对工作区根；最多 8 条；只读渲染勾选态）
          # copyTemplate: 说人话大白话，说清楚前因后果，给建议。   # 复制话术模板（缺省即此句）

    # ── 批 39 / 设计档 §二十二：Agent Preset 随包分发（两档）──────────────────────
    # 一个预设 = 组合里的一行 Loader 条目（`@deepseek-ai/dsh-agent-preset`；config 要求 id + plugins）。
    # 写在**本 bundle 的 patch** 里 ⇒ 随包分发：别人装上同一版就有；`~/.dsh/.agent-presets/` 目录
    # 在 0.2.x 已无人读取（平台原文「Nothing reads that directory any more」），不要往那里写。
    # 每条 `name:` 都在 0.2.1-rc.2 装机包内逐个核实过（见 docs/2026-10-16-task-ledger-design.md §二十二）。
    - id: preset-thincoder-eng
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: thincoder-eng           # ★ 必须精确：lib/index.mjs 的 PRESET_MATCH = /^(thincoder-eng)$/i 靠它自动进工程模式
        name: 'thincoder-eng（工程模式）'
        description: '工程模式一键入口：架构师人格 + 完整工具面；会话创建即进工程模式（advisor / eng_coder / escalate / consult 由本插件提供）。'
        order: 20
        plugins:
          # 0.2.1 的 dsh-persona 配置是 { prefix, suffix?, complete?, includeRuntimeContext? }；
          # 老组成档（0.1.x）用的 `text:` 键**已不存在** ⇒ 这里用 prefix + complete（整份人格替换）。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the architect of an engineering-mode session, powered by the {{model}} model, working in {{cwd}}. Your deliverables are requirements and design documents and approved implementation plans — not code. You clarify with open-ended questions, you write design docs before any implementation, and the design review is fired by the USER, never by you. Implementation goes through eng_coder sub-agents carrying a design token from a passed advisor(type='design') review. After each eng_coder delivery you run the delivery review automatically. You end every turn by naming your current workflow state and what the user must do next.
              complete: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # ── shell（平台门控与内置代码预设逐字同形）──
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # ── filesystem ──
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-str-replace-editor
            name: '@deepseek-ai/dsh-tool-str-replace-editor'
          # ── background jobs（只含模型面控制；任务注册表留在宿主面）──
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # ── skills ──
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # ── goals ──
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # ── plan mode ──
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          # ── compaction（自动压缩按 0.2.1 缺省 auto=true）──
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.55
                  retainRatio: 0.2
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ── delegation and workflows ──
          # ★ 批 39 移植必修①：`@deepseek-ai/dsh-workflow-worker-thread` 在 0.2.1 装机包**不存在**
          #   ⇒ 换 `@deepseek-ai/dsh-workflow-ptc`，并按设计档 §22.3 先删 `config.provider`
          #   （ptc 的 provider 缺省即 spawn）。
          # ★ 移植必修②：0.2.1 的 tool-subagent 配置面已无 `backgroundMode` / `enableRunInBackground`
          #   （persona / toolFilter 更是显式移除）⇒ 只保留 provider / toolName / maxDepth。
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: codex
                  toolName: subagent_codex
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          # ── remaining model-facing rows ──
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
          # 原生呈现（native）：router-bootstrap 在 phase_begin 调 toolsSvc.presentAs('native')
          # ⇒ 工具直接可调用，本预设不挂 Code Mode / SDK 行。

    - id: preset-thincoder-consult-ro
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: thincoder-consult-ro    # ★ 必须精确：lib/consult.mjs 的 CONSULT_READONLY_PRESET 逐字依赖它
        name: 'thincoder-consult-ro（只读会诊）'
        description: '只读会诊子代理：读 / 检索 / 联网 / skill 读；无写、无执行、无后台作业、无再委派。'
        order: 21
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # fs：0.2.1 的 tool-fs 自带 read / readImage / write / edit 四个开关 ⇒ 写与改**配置关掉**，
          # 不必整行剔除（读面完整保留：read + read_image）。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # skills：注册表在宿主面，本预设只贡献自己的那一层（读目录 + 载入器）
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # 联网：检索 + 抓取都要（会诊的只读白名单历史上含 web_search / web_fetch）
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: true
              fetch: true
              searchTimeoutMs: 60000
          # compaction：会诊子代理可能连读多份文档；自动压缩按 0.2.1 缺省 auto=true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # 刻意**不含**：tool-bash / tool-pwsh / tool-str-replace-editor / tool-jobs / tool-ralph /
          # tool-workflow / tool-subagent* / tool-terminal* / tool-todo / tool-ask-user / tool-goal /
          # tool-schedule / tool-present / tool-worktree —— 写、执行、后台作业、再委派一律不进只读面。
          # 残余面如实登记（设计档 §22.4 之外的事实）：**全局注册的工具**（各插件挂宿主面注册的，
          # 例如本插件的 task_* / consult_*）按平台语义「作用域注册只遮蔽全局，预设无法隐藏全局」
          # ⇒ 预设能收窄的是「预设贡献的那一层」。`CONSULT_READONLY_DISCLAIMER` 的「本部署无法
          # 保证只读」因此**仍然成立**（证据口径未变）。
